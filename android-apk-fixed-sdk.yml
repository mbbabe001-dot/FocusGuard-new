name: Build FocusGuard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack FocusGuard source
        run: |
          set -e
          test -f FocusGuard-new-repo-source.zip
          rm -rf /tmp/focusguard-src
          mkdir -p /tmp/focusguard-src
          unzip -q FocusGuard-new-repo-source.zip -d /tmp/focusguard-src

          if [ -d "/tmp/focusguard-src/FocusGuard" ]; then
            cp -a /tmp/focusguard-src/FocusGuard/. ./
          else
            cp -a /tmp/focusguard-src/. ./
          fi

          rm -f FocusGuard-new-repo-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          set -e
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
